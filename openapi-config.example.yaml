# required: url of the openapi document
openapiUrl: "http://localhost:8080/v3/api-docs"

# directory for one json file per tag
outputDir: "./openapi/domains"

# directory for generated typescript types
typesOutputDir: "./openapi/types"

# directory for cached documents and change reports
cacheDir: "./openapi/.cache"

# optional tag overrides
# domains:
#   examinations:
#     tag: "Examinations"
#     description: "Examination management"
